name: Public engineering prototypes — executable tests and release audit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engineering-demos:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all demos and full tests (no paid API or cloud dependencies)
        shell: bash
        run: |
          set -euo pipefail
          for project in projects/*; do
            (cd "$project" && python demo.py && python -m unittest discover -s tests -v)
          done
      - name: Scan public files and full Git history for secrets
        run: python tools/public_release_audit.py --root . --history --report /tmp/public_release_audit.json
